# ============================================================
# ReSukiSU Kernel Builder - Configuration
# ============================================================
# Edit these values to match your setup.
# All paths are relative to the builder root unless absolute.
# ============================================================

# --- Kernel Source ---
KERNEL_REPO="https://github.com/ederevx/x-ft_kernel_oneplus_msm8998"
KERNEL_BRANCH="stable"
KERNEL_DIR="kernel_source"

# --- Defconfig ---
DEFCONFIG="msm8998_oneplus_android_defconfig"

# --- ReSukiSU ---
RESUKISU_REPO="https://github.com/ReSukiSU/ReSukiSU"
RESUKISU_BRANCH="main"
RESUKISU_TAG=""  # Leave empty for latest, or set e.g. "v1.0.0"

# --- SuSFS (optional) ---
SUSFS_ENABLED="true"   # Set to "false" to disable SuSFS
SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
SUSFS_BRANCH="kernel-4.14"

# --- Toolchain ---
# Options: "proton-clang", "aosp-clang", "system-clang"
TOOLCHAIN_TYPE="proton-clang"
PROTON_CLANG_REPO="https://github.com/kdrag0n/proton-clang"
PROTON_CLANG_BRANCH="master"
TOOLCHAIN_DIR="toolchains"

# --- GCC Cross-compiler (for vDSO / 32-bit compat) ---
GCC_AARCH64_REPO="https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9"
GCC_AARCH64_BRANCH="lineage-19.1"
GCC_ARM32_REPO="https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9"
GCC_ARM32_BRANCH="lineage-19.1"

# --- Build ---
ARCH="arm64"
SUBARCH="arm64"
KERNEL_IMAGE="Image.gz-dtb"
THREADS="$(nproc)"     # auto-detect, or set a fixed number
USE_CCACHE="true"

# --- Output ---
OUTPUT_DIR="out"
FINAL_OUTPUT_DIR="output"

# --- Boot Image (optional) ---
# Set to the path of your stock boot.img for repacking
# Leave empty to skip boot.img repacking
BOOT_IMG="${BUILDER_ROOT}/boot.img"  # Pre-existing stock boot.img

# --- AnyKernel3 (optional) ---
# Set to "true" to package output into AnyKernel3 zip
USE_ANYKERNEL3="true"
ANYKERNEL3_REPO="https://github.com/osm0sis/AnyKernel3"
ANYKERNEL3_BRANCH="master"
